:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#dde5ee;--text:#1d2533;--muted:#5d6878;--board:#15181e;--tile:#262a31;--amber:#ffc828;--white:#f1f0ea;
  --red:#ff6b5a;--green:#7ee08a;--field:#ffffff;--line:#b8c3d1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0e131a;--text:#e6ebf2;--muted:#8d98a8;--field:#1a212b;--line:#2c3644}}
:root[data-theme="dark"]{--page:#0e131a;--text:#e6ebf2;--muted:#8d98a8;--field:#1a212b;--line:#2c3644}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--page);color:var(--text);font-family:"Sky Harbor Text",system-ui,sans-serif}
main{max-width:1040px;margin:0 auto;padding:clamp(16px,4vw,40px)}
.board{background:var(--board);border-radius:18px;padding:clamp(14px,3vw,32px);overflow-x:auto;
  box-shadow:inset 0 0 0 1px #000,inset 0 2px 0 #2a2f38}
.title{font-size:clamp(28px,7.2vw,72px);--sf-ink:var(--amber)}
.cols{display:grid;grid-template-columns:auto auto auto auto;gap:0 clamp(10px,2vw,22px);margin-top:clamp(16px,3vw,28px);
  font-size:clamp(14px,2.9vw,30px);justify-content:start}
.cols .h{font-family:"Sky Harbor Text",sans-serif;font-size:max(12px,.42em);color:#8d98a8;padding:0 0 .5em;white-space:nowrap}
.cols .c{margin-bottom:.22em;--sf-ink:var(--white)}
.cols .c.status{--sf-ink:var(--amber)}
.cols .c.status.late{--sf-ink:var(--red)}
.cols .c.status.gone{--sf-ink:#8d98a8}
.msg{margin-top:clamp(16px,3vw,28px);font-size:clamp(14px,2.9vw,30px);--sf-ink:var(--green)}
form{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center}
input{flex:1 1 220px;font:inherit;font-size:18px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
  background:var(--field);color:var(--text);text-transform:uppercase}
button{font:inherit;font-size:17px;padding:12px 18px;border-radius:10px;border:0;cursor:pointer;background:var(--board);color:var(--amber)}
button.alt{background:transparent;color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
.speed{display:flex;align-items:center;gap:12px;margin-top:16px;color:var(--muted);font-size:16px}
.speed input{flex:0 1 280px;padding:0;accent-color:var(--board)}
.speed output{min-width:5ch;color:var(--text)}
p.note{color:var(--muted);font-size:15px;line-height:1.5;max-width:62ch}
</style></head>
<body><main>
<div class="board">
  <div class="title" id="title"></div>
  <div class="cols" id="cols">
    <div class="h">Flight</div><div class="h">Destination</div><div class="h">Gate</div><div class="h">Status</div>
  </div>
  <div class="msg" id="msg"></div>
</div>
<form id="f">
  <input id="in" maxlength="16" placeholder="Type up to 16 characters" aria-label="Message for the bottom row">
  <button type="submit">Show on board</button>
  <button type="button" class="alt" id="shuffle">New departures</button>
</form>
<label class="speed">Flip duration <input type="range" id="speed" min="60" max="900" step="20" value="260"> <output id="speedv">260 ms</output></label>
<p class="note">Each cell flips through the drum in order until it reaches its character. Every frame is a CSS matrix3d built in TypeScript (perspective times rotateX); there are no CSS transitions.</p>
</main>
<script>
(() => {
"use strict";
/**
 * Split-flap (Solari) board for Sky Harbor.
 *
 * Tiles are drawn with CSS; characters come from "Sky Harbor Board Letters".
 * Each flip is driven by requestAnimationFrame and written as a CSS matrix3d
 * (perspective × rotateX), so no CSS transitions or keyframes are involved.
 *
 * Font setup (the metric overrides keep the glyph's split aligned with the tile's split
 * on every platform):
 *
 *   @font-face {
 *     font-family: "Sky Harbor Board Letters";
 *     src: url("SkyHarborBoardLetters-Regular.ttf") format("truetype");
 *     ascent-override: 90%; descent-override: 20%; line-gap-override: 0%;
